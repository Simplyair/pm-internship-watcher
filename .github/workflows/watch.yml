# Cloud watcher: runs whether or not your Mac is on.
#
# Setup:
#   1. Push to a PRIVATE GitHub repo.
#   2. Settings > Secrets and variables > Actions:
#        TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
#   3. Turn off the Mac job so alerts do not arrive twice:
#        launchctl bootout gui/$(id -u)/com.pmintern.watcher
#
# Budget: GitHub bills each job rounded UP to the nearest minute, so run
# COUNT is the cost, not run length. Cloudflare dispatches ~2,159 times a
# month and this safety net adds ~90, for ~2,250 of the 3,000 minutes that
# GitHub Pro / Student Pack includes -- about 75%.
name: PM internship watch

on:
  # The real clock lives in cloudflare-trigger/, which calls workflow_dispatch.
  # GitHub's own scheduler was measured delivering ~1 run per 8 requested, with
  # gaps up to 7 hours, so this cron is only a safety net for the case where
  # the Worker stops firing.
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:

concurrency:
  group: pm-internship-watch
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 3     # a hung run must never eat the monthly budget
    steps:
      - uses: actions/checkout@v4

      # No setup-python step: ubuntu-latest ships python3 and this project is
      # standard-library only. Skipping it saves ~15s of billed time per run.

      # jobs.db is the dedupe ledger -- without it every run re-alerts
      # everything. .cache holds the ETag for the 11MB community feed, which
      # turns a full download into a 304 and keeps runs under the 1-minute
      # billing boundary.
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: |
            jobs.db
            .cache
          key: pm-state-${{ github.run_id }}
          restore-keys: pm-state-

      - name: Scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 cli.py scan

      - name: Save state
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            jobs.db
            .cache
          key: pm-state-${{ github.run_id }}
