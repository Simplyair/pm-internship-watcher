# Cloud watcher: runs even when your Mac is closed.
#
# Setup:
#   1. Create a PRIVATE repo on GitHub and push this project to it.
#   2. Settings > Secrets and variables > Actions > New repository secret:
#        TELEGRAM_BOT_TOKEN   (from @BotFather)
#        TELEGRAM_CHAT_ID     (the number in your local .env)
#   3. Turn OFF the local Mac job so alerts do not arrive twice:
#        launchctl bootout gui/$(id -u)/com.pmintern.watcher
#
# Budget: every 30 min = 48 runs/day = ~1,440 runs/month. Each run bills as
# 1 minute (GitHub rounds each job up), so ~1,440 of the 3,000 minutes that
# GitHub Pro / Student Pack includes for private repos. Roughly half.
name: PM internship watch

on:
  schedule:
    - cron: "0,30 * * * *"   # :00 and :30. GitHub queues cron under load.
  workflow_dispatch:

concurrency:
  group: pm-internship-watch
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5      # a hung run must not silently eat the budget
    steps:
      - uses: actions/checkout@v4

      # No setup-python step on purpose: ubuntu-latest ships a recent python3
      # and this project is standard-library only. Skipping it saves ~15s of
      # billed time on every single run.

      # jobs.db is the dedupe ledger. Without it every run re-alerts everything.
      - name: Restore database
        uses: actions/cache/restore@v4
        with:
          path: jobs.db
          key: pm-jobs-db-${{ github.run_id }}
          restore-keys: pm-jobs-db-

      - name: Scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 cli.py scan

      - name: Save database
        uses: actions/cache/save@v4
        if: always()
        with:
          path: jobs.db
          key: pm-jobs-db-${{ github.run_id }}
