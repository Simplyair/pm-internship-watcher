# High-frequency Monday vigil for the Zynga PM / rotational programme drop.
#
# Scans ONE company, so a run is a fraction of a second of work -- but GitHub
# bills per job rounded up to a minute, so the cost is the run COUNT, not the
# scan size. ~156 requested runs across Monday is ~5% of the monthly budget,
# and GitHub throttles scheduled runs heavily anyway.
#
# Shares the concurrency group AND cache prefix with the main watcher, so the
# two serialise and use one database. No duplicate alerts.
#
# Delete this file, or run `gh workflow disable "Zynga Monday watch"`, once the
# drop has landed.
name: Zynga Monday watch

on:
  schedule:
    - cron: "*/5 11-23 * * 1"    # every 5 min, Mondays 7am-8pm ET
  workflow_dispatch:

concurrency:
  group: pm-internship-watch     # same group as the main watcher: never overlap
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: |
            jobs.db
            .cache
          key: pm-state-${{ github.run_id }}
          restore-keys: pm-state-

      - name: Scan Zynga only
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 cli.py scan --only Zynga

      - name: Persist tracker decisions
        if: always()
        run: |
          if [ -n "$(git status --porcelain tracker.json)" ]; then
            git config user.name "pm-internship-watcher"
            git config user.email "actions@users.noreply.github.com"
            git add tracker.json
            git commit -m "Update tracker from Telegram [skip ci]"
            git push
          fi

      - name: Save state
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            jobs.db
            .cache
          key: pm-state-${{ github.run_id }}
